# Allow scrolling in terminal with mouse or trackpad
set -g mouse on

# ── Gruvbox visual theme for tmux ──────────────────────────────
# Purely cosmetic. No keybinds or functional settings touched.
# Palette matches alacritty.toml / bashrc / zshrc gruvbox setup.

# True color support so the hex colors below render correctly
set -ga terminal-overrides ",xterm-256color:Tc"
set -g default-terminal "tmux-256color"

# ── Palette reference ───────────────────────────────────────────
# bg0      #282828   fg1      #ebdbb2
# bg1      #3c3836   gray     #928374
# blue     #458588   bright_blue    #83a598
# aqua     #689d6a   bright_aqua    #8ec07c
# yellow   #d79921   bright_yellow  #fabd2f
# purple   #b16286   bright_purple  #d3869b
# red      #cc241d   bright_red     #fb4934
# orange   #d65d0e

# ── Status bar base ─────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-position bottom

set -g status-style "bg=#282828,fg=#ebdbb2"

# ── Left: session name ──────────────────────────────────────────
set -g status-left-length 40
set -g status-left "#[bg=#458588,fg=#282828,bold] #S #[bg=#282828,fg=#458588]"

# ── Right: date / time, blue+purple accents, no green ───────────
set -g status-right-length 100
set -g status-right "#[fg=#928374,bg=#282828]#[bg=#3c3836,fg=#d3869b] %Y-%m-%d #[fg=#928374]│#[fg=#83a598] %H:%M #[bg=#282828,fg=#3c3836]"

# ── Window list ──────────────────────────────────────────────────
set -g window-status-format " #[fg=#928374]#I #[fg=#a89984]#W "
set -g window-status-current-format "#[bg=#3c3836,fg=#282828]#[bg=#3c3836,fg=#fabd2f,bold] #I #[fg=#ebdbb2]#W #[bg=#282828,fg=#3c3836]"

set -g window-status-separator ""
set -g window-status-activity-style "fg=#fb4934,bg=#282828"
set -g window-status-bell-style "fg=#fb4934,bg=#282828,bold"

# ── Pane borders ─────────────────────────────────────────────────
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"

# ── Pane number display (prefix + q) ─────────────────────────────
set -g display-panes-colour "#928374"
set -g display-panes-active-colour "#d3869b"

# ── Messages / command prompt ─────────────────────────────────────
set -g message-style "bg=#3c3836,fg=#fabd2f"
set -g message-command-style "bg=#3c3836,fg=#83a598"

# ── Clock mode (prefix + t) ────────────────────────────────────────
set -g clock-mode-colour "#83a598"

# ── Copy mode selection highlight ─────────────────────────────────
set -g mode-style "bg=#d3869b,fg=#282828"
